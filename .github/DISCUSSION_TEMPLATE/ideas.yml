labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Clutch!

        Ideas are discussed here first. If one is accepted, a maintainer turns it into a scoped issue
        that contributors can pick up. Please don't open a pull request for an idea that hasn't been
        accepted: it may not fit the product, and your work would be wasted.
  - type: checkboxes
    id: checks
    attributes:
      label: First check
      options:
        - label: I searched existing Discussions and this hasn't been proposed yet.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Clutch?
      multiple: true
      options:
        - Web app
        - API (backend)
        - CLI (myclutch)
        - Docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Start from the problem, not the solution. What's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the change. Mockups, sketches or example CLI output are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
