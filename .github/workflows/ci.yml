# Continuous integration: every push and pull request gets a fresh machine that
# lints, tests and builds each part of Clutch. A red check blocks the merge.
name: CI

# When to run.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that's still going for the old
# commit, since only the newest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code. Nothing here can write to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Reuse downloaded packages between runs until the requirements change.
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json lists, never newer.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  cli:
    name: CLI (build + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the package
        run: |
          pip install build
          python -m build

      # Install the built wheel the way a user would get it from PyPI, then
      # check the `clutch` command actually starts.
      - name: Install and run it
        run: |
          pip install dist/*.whl
          clutch --help
