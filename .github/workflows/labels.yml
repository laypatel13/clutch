# Keeps the repository's labels in sync with .github/labels.yml.
name: Labels

on:
  # On a pull request that edits the labels, only preview what would change.
  pull_request:
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  # Once merged into main, apply it for real.
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml

permissions:
  contents: read
  # Creating, editing and deleting labels counts as writing to issues.
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          yaml-file: .github/labels.yml
          # Pull requests get a dry run: the log lists every change, nothing is applied.
          dry-run: ${{ github.event_name == 'pull_request' }}
